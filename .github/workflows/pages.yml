name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    name: Build static site
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export site
        env:
          BASE_PATH: /2daymovie
          OFFICIAL_URL: https://arnold-rg.github.io/2daymovie/
          STATIC_EXPORT: "1"
          REVIEWS_LOCAL_ONLY: "1"
        run: python scripts/export_site.py --out site

      - name: Check Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' || echo unknown)
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.pages.outputs.build_type == 'workflow'
        with:
          path: site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
