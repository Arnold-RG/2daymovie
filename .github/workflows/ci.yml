name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Export public site
        env:
          BASE_PATH: /2daymovie
          OFFICIAL_URL: https://arnold-rg.github.io/2daymovie/
          STATIC_EXPORT: "1"
          REVIEWS_LOCAL_ONLY: "1"
        run: |
          python scripts/export_site.py --out /tmp/2daymovie-site --base /2daymovie/
          test -f /tmp/2daymovie-site/index.html
          test -f /tmp/2daymovie-site/.nojekyll || true
          # GitHub Pages serves main:/docs, so the committed copy must match the site.
          diff -r /tmp/2daymovie-site docs

      - name: Health smoke
        run: |
          python - <<'PY'
          from app import app
          c = app.test_client()
          assert c.get("/healthz").status_code == 200
          assert c.get("/readyz").status_code == 200
          assert c.get("/").status_code == 200
          assert c.get("/data/catalog.json").status_code == 200
          assert c.get("/metrics").status_code == 404  # private unless METRICS_TOKEN is set
          # legacy /library links redirect to the new home page
          assert c.get("/library").status_code in (301, 302)
          assert c.get("/library", follow_redirects=True).status_code == 200
          print("ops smoke ok")
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image
        run: docker build -t twodaymovie:ci .

      - name: Container healthcheck
        run: |
          docker run -d --name twodaymovie-ci -p 18080:8080 -e FLASK_DEBUG=0 twodaymovie:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              curl -fsS http://127.0.0.1:18080/readyz
              docker stop twodaymovie-ci
              exit 0
            fi
            sleep 2
          done
          docker logs twodaymovie-ci || true
          docker stop twodaymovie-ci || true
          exit 1

  lint-compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate compose file
        # Placeholder so the required ${GRAFANA_ADMIN_PASSWORD:?} interpolation resolves.
        # Not a secret: config -q only parses the file and starts nothing.
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: docker compose config -q
