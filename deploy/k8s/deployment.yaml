apiVersion: apps/v1
kind: Deployment
metadata:
  name: twodaymovie
  labels:
    app: twodaymovie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: twodaymovie
  template:
    metadata:
      labels:
        app: twodaymovie
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: twodaymovie:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: twodaymovie-config
          env:
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: twodaymovie-secrets
                  key: TMDB_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: twodaymovie
  labels:
    app: twodaymovie
spec:
  type: ClusterIP
  selector:
    app: twodaymovie
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: twodaymovie-secrets
type: Opaque
stringData:
  TMDB_API_KEY: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twodaymovie
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: twodaymovie.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twodaymovie
                port:
                  name: http
