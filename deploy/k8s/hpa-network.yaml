apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: twodaymovie
  labels:
    app: twodaymovie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: twodaymovie
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: twodaymovie
  labels:
    app: twodaymovie
spec:
  podSelector:
    matchLabels:
      app: twodaymovie
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
