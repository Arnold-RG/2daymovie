global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: twodaymovie
    metrics_path: /metrics
    # /metrics is token-gated: put the same value as METRICS_TOKEN in
    # deploy/monitoring/metrics_token (gitignored).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["web:8080"]
        labels:
          service: twodaymovie
