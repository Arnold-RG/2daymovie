services:
  - type: web
    name: twodaymovie
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FLASK_DEBUG
        value: "0"
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_WATCH_REGION
        value: US
      - key: DATABASE_URL
        sync: false
      - key: OFFICIAL_DATABASE_URL_FILE
        sync: false
