<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f0f2" />
  <meta name="color-scheme" content="light" />
  <title>{% block title %}Amora — Love Poems{% endblock %}</title>
  <meta name="description" content="{{ meta_description|default('Amora is a quiet collection of love poems — classic verses and tender contemporary lyrics to read slowly.') }}" />
  <link rel="canonical" href="{{ official_url.rstrip('/') }}{{ request.path }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ meta_title|default('Amora — Love Poems') }}" />
  <meta property="og:description" content="{{ meta_description|default('A quiet collection of love poems to read slowly.') }}" />
  <meta property="og:url" content="{{ official_url.rstrip('/') }}{{ request.path }}" />
  <meta property="og:site_name" content="Amora" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="{{ url_for('static', filename='poems/img/favicon.svg') }}" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='poems/css/style.css', v='20260928a') }}" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to poems</a>

  <header class="amora-header" data-amora-header>
    <a class="amora-brand" href="{{ url_for('poems_home') }}" aria-label="Amora home">Amora</a>
    <nav class="amora-nav" aria-label="Amora">
      <a href="{{ url_for('poems_home') }}#collection">Collection</a>
      <a href="{{ url_for('poems_home') }}#about">About</a>
      <a class="amora-nav-quiet" href="{{ url_for('home') }}">2daymovie</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="amora-footer">
    <p class="amora-footer-brand">Amora</p>
    <p>A quiet shelf of love poems — classics in the public domain, and a few new verses written for this room.</p>
  </footer>

  <script src="{{ url_for('static', filename='poems/js/script.js', v='20260928a') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
