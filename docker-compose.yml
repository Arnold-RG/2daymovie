services:
  web:
    build: .
    image: twodaymovie:local
    container_name: twodaymovie-web
    restart: unless-stopped
    environment:
      PORT: "8080"
      FLASK_DEBUG: "0"
      OFFICIAL_URL: "https://twodaymovie.onrender.com/"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_WATCH_REGION: "${TMDB_WATCH_REGION:-US}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    container_name: twodaymovie-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: twodaymovie-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - edge

  grafana:
    image: grafana/grafana:11.3.0
    container_name: twodaymovie-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - edge

networks:
  edge:
    driver: bridge
