<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2DayMovie — Worldwide Cinema</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f0f; color: #fff; font-family: 'Inter', system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 100; background: rgba(15,15,15,.95); backdrop-filter: blur(10px); padding: 14px 4%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
.logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: #e50914; }
.search { background: #222; border: 1px solid #444; color: #fff; padding: 8px 14px; border-radius: 4px; width: 220px; }
.hero { height: 60vh; min-height: 380px; background: linear-gradient(to right, rgba(0,0,0,.8) 30%, transparent), url('https://i.ytimg.com/vi/mi4gQMDgB_g/maxresdefault.jpg') center/cover; display: flex; align-items: center; padding: 0 4%; }
.hero-content { max-width: 500px; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; line-height: 1.05; margin-bottom: 12px; }
.hero p { color: #ccc; margin-bottom: 20px; line-height: 1.5; }
.btn { background: #e50914; color: #fff; padding: 12px 24px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
.rows { padding: 20px 0 60px; }
.row { margin-bottom: 28px; }
.row h2 { padding: 0 4%; margin-bottom: 10px; font-size: 18px; font-weight: 700; }
.row-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 4% 8px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.card { flex: 0 0 200px; background: #1a1a1a; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform .2s; }
.card:hover { transform: scale(1.06); z-index: 2; }
.card img { width: 100%; height: 112px; object-fit: cover; background: #222; display: block; }
.card .info { padding: 8px 10px 12px; }
.card h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.card small { color: #888; font-size: 11px; }
.player { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
.player.show { display: flex; }
.player header { background: #111; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; }
.player button { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
.player .screen { flex: 1; display: grid; place-items: center; padding: 20px; }
.fallback { text-align: center; max-width: 400px; }
.fallback a { display: inline-block; margin-top: 16px; background: #e50914; color: #fff; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: 600; }
@media (max-width: 640px) { .search { width: 140px; } .hero { height: 50vh; } }
</style>
</head>
<body>
<header>
  <div class="logo"><span>2DAY</span>MOVIE</div>
  <input class="search" type="search" id="search" placeholder="Search titles...">
</header>

<div class="hero">
  <div class="hero-content">
    <h1>Worldwide Cinema</h1>
    <p>Full-length films, series, and cartoons from official sources. Click any title to watch.</p>
    <button class="btn" onclick="document.querySelector('.rows').scrollIntoView({behavior:'smooth'})">Browse Now</button>
  </div>
</div>

<div class="rows" id="rows"></div>

<div class="player" id="player">
  <header>
    <strong id="ptitle">Now Playing</strong>
    <button onclick="closePlayer()">✕</button>
  </header>
  <div class="screen" id="pscreen"></div>
</div>

<script>
const records = [
  {id:'mi4gQMDgB_g', title:'Office Romance', creator:'Mosfilm', type:'Romantic'},
  {id:'4GskjSBw9lA', title:'The Girls', creator:'Mosfilm', type:'Romantic'},
  {id:'CLjLLHDUiiA', title:'Love and Doves', creator:'Mosfilm', type:'Romantic'},
  {id:'eXaYYMvmNZ4', title:'The Most Charming and Attractive', creator:'Mosfilm', type:'Romantic'},
  {id:'ms5Ga6kNvHM', title:'The Irony of Fate (Part 1)', creator:'Mosfilm', type:'Romantic'},
  {id:'luHarTc90QA', title:'The Irony of Fate (Part 2)', creator:'Mosfilm', type:'Romantic'},
  {id:'bUya5DBvw_g', title:'Railway Station for Two', creator:'Mosfilm', type:'Romantic'},
  {id:'TxrtUnWBCeI', title:'Carnival Night', creator:'Mosfilm', type:'Romantic'},
  {id:'NTWA_7-ld_U', title:'Moscow Does Not Believe in Tears', creator:'Mosfilm', type:'Drama'},
  {id:'Q3hBLv-HLEc', title:'Stalker', creator:'Mosfilm', type:'Drama'},
  {id:'Z8ZhQPaw4rE', title:'Solaris', creator:'Mosfilm', type:'Drama'},
  {id:'a-RLbCXVvwI', title:'The Red Snowball Tree', creator:'Mosfilm', type:'Drama'},
  {id:'Mhz-bn1ys4Y', title:'Scarlet Sails', creator:'Mosfilm', type:'Drama'},
  {id:'6Lnb1bI0VIk', title:'Ivan\'s Childhood', creator:'Mosfilm', type:'Drama'},
  {id:'NrMINC5xjMs', title:'The Mirror', creator:'Mosfilm', type:'Drama'},
  {id:'je75FDjcUP4', title:'Andrei Rublev', creator:'Mosfilm', type:'Drama'},
  {id:'GgFLr2bjUNM', title:'Mimino', creator:'Mosfilm', type:'Comedy'},
  {id:'m3n4LptYWNo', title:'Operation Y and Shurik\'s Other Adventures', creator:'Mosfilm', type:'Comedy'},
  {id:'MkHiu9fD820', title:'The Diamond Arm', creator:'Mosfilm', type:'Comedy'},
  {id:'XukcyHljlCE', title:'Gentlemen of Fortune', creator:'Mosfilm', type:'Comedy'},
  {id:'8KYUSLtXJyo', title:'Kidnapping, Caucasian Style', creator:'Mosfilm', type:'Comedy'},
  {id:'l7eIIIPBNUc', title:'Ivan Vasilievich Changes Profession', creator:'Mosfilm', type:'Comedy'},
  {id:'VahEhy4HJu4', title:'Garage', creator:'Mosfilm', type:'Comedy'},

  {id:'tSAKzVP2IGk', title:'Wild Kratts - Stuck on Sharks', creator:'PBS KIDS', type:'Series'},
  {id:'F1z5E5gzlLA', title:'Wild Kratts - Creature Power Challenge', creator:'PBS KIDS', type:'Series'},
  {id:'KX2HzjI0XO4', title:'Wild Kratts - Secrets of the Spider\'s Web', creator:'PBS KIDS', type:'Series'},
  {id:'rRCRY9m1g9Q', title:'Wild Kratts - Panda Power Up', creator:'PBS KIDS', type:'Series'},
  {id:'5XpyVz5Bb7c', title:'Wild Kratts - Outfoxed', creator:'PBS KIDS', type:'Series'},
  {id:'PfgJJ2Sst6A', title:'SUPER WHY! - Three Little Pigs', creator:'PBS KIDS', type:'Kids'},
  {id:'DOuRjoRYby8', title:'SUPER WHY! - Cinderella', creator:'PBS KIDS', type:'Kids'},
  {id:'QjWhDynv-SQ', title:'Sid the Science Kid - The Big Sneeze', creator:'PBS KIDS', type:'Kids'},

  {id:'9kncDIPfWr8', title:'Booba Compilation', creator:'Booba', type:'Cartoon Series'},
  {id:'7tuAFeTkBAU', title:'Booba All Episodes', creator:'Booba', type:'Cartoon Series'},
  {id:'Vsnius8Ka_I', title:'Ballad of a Soldier', creator:'Mosfilm', type:'War'},
  {id:'2rINnJat-5k', title:'The Cranes Are Flying', creator:'Mosfilm', type:'War'},
  {id:'S-XKsnQCLoE', title:'Night of the Living Dead (1968)', creator:'Public Domain', type:'Horror'},
  {id:'EYHv8eJrW2Y', title:'Kin-Dza-Dza!', creator:'Mosfilm', type:'Sci-Fi'},
  {id:'t43KXauHJZg', title:'Plan 9 from Outer Space', creator:'Public Domain', type:'Sci-Fi'},
  {id:'vDtxO70AQZ4', title:'Hussar Ballad', creator:'Mosfilm', type:'Musical'},
  {id:'Pw6YzbxYAQY', title:'White Sun of the Desert', creator:'Mosfilm', type:'Adventure'},
  {id:'Rq2fttKL0AY', title:'Ilya Muromets', creator:'Mosfilm', type:'Adventure'},
  {id:'rALCUZv_cyk', title:'The Detached Mission', creator:'Mosfilm', type:'Action'}
];

function render(filter='') {
  const q = filter.toLowerCase();
  const groups = {};
  records.forEach(r => {
    if (!r.title.toLowerCase().includes(q)) return;
    if (!groups[r.type]) groups[r.type] = [];
    groups[r.type].push(r);
  });
  let html = '';
  Object.keys(groups).forEach(type => {
    html += `<div class="row"><h2>${type}</h2><div class="row-scroll">`;
    groups[type].forEach(r => {
      const safe = r.title.replace(/'/g, "\\'");
      html += `<div class="card" onclick="play('${r.id}','${safe}')">
        <img src="https://i.ytimg.com/vi/${r.id}/hqdefault.jpg" alt="">
        <div class="info"><h3>${r.title}</h3><small>${r.creator}</small></div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('rows').innerHTML = html || '<p style="padding:20px 4%">No titles found.</p>';
}

function play(id, title) {
  document.getElementById('ptitle').textContent = title;
  document.getElementById('pscreen').innerHTML = `
    <div class="fallback">
      <p>This video cannot be played here because the owner has disabled embedding.</p>
      <a href="https://www.youtube.com/watch?v=${id}" target="_blank">Watch on YouTube</a>
    </div>`;
  document.getElementById('player').classList.add('show');
}

function closePlayer() {
  document.getElementById('player').classList.remove('show');
  document.getElementById('pscreen').innerHTML = '';
}

document.getElementById('search').oninput = e => render(e.target.value);
render();
</script>
</body>
</html>
