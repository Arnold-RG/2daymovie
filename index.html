<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>2DayMovie</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, transparent); padding: 16px 4%; display: flex; align-items: center; justify-content: space-between; }
header.scrolled { background: #141414; }
.logo { font-size: 26px; font-weight: 800; color: #e50914; }
nav { display: flex; gap: 20px; }
nav a { color: #e5e5e5; font-size: 14px; text-decoration: none; }
nav a:hover { color: #fff; }
.search { background: rgba(0,0,0,.5); border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 4px; width: 180px; }
.hero { height: 80vh; min-height: 500px; position: relative; overflow: hidden; }
.hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(20,20,20,.85) 30%, transparent 70%); }
.hero-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 4%; max-width: 580px; }
.hero h1 { font-size: clamp(36px, 5vw, 58px); font-weight: 800; line-height: 1.05; margin-bottom: 12px; }
.hero p { font-size: 17px; color: #ddd; margin-bottom: 20px; }
.btn-row { display: flex; gap: 12px; }
.btn { padding: 12px 24px; border-radius: 4px; font-weight: 600; border: none; cursor: pointer; }
.btn-primary { background: #fff; color: #000; }
.btn-secondary { background: rgba(109,109,110,.7); color: #fff; }
.rows { padding: 20px 0 60px; }
.row { margin-bottom: 28px; }
.row h2 { padding: 0 4%; margin-bottom: 10px; font-size: 20px; font-weight: 700; }
.row-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 4% 10px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.card { flex: 0 0 230px; position: relative; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform .2s; }
.card:hover { transform: scale(1.07); z-index: 5; }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; display: block; }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.9)); padding: 30px 10px 10px; opacity: 0; transition: opacity .2s; }
.card:hover .card-info { opacity: 1; }
.card-info h3 { font-size: 14px; font-weight: 600; }
.player { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 200; display: none; flex-direction: column; }
.player.show { display: flex; }
.player header { background: #111; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; }
.player button { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }
.player .screen { flex: 1; display: grid; place-items: center; padding: 20px; }
.player iframe { width: 100%; max-width: 1200px; aspect-ratio: 16/9; border: 0; border-radius: 8px; }
.fallback { text-align: center; max-width: 440px; display: none; }
.fallback.show { display: block; }
.fallback a { display: inline-block; margin-top: 16px; background: #e50914; color: #fff; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: 600; }
@media (max-width: 700px) { nav { display: none; } .search { width: 120px; } }
</style>
</head>
<body>
<header id="header">
  <div class="logo">2DAYMOVIE</div>
  <nav>
    <a href="#movies">Movies</a>
    <a href="#series">Series</a>
    <a href="#kids">Kids</a>
    <a href="#cartoons">Cartoons</a>
    <a href="#trailers">Upcoming</a>
  </nav>
  <input class="search" type="search" id="search" placeholder="Search...">
</header>

<div class="hero">
  <iframe class="hero-video" id="heroVideo" src="https://www.youtube-nocookie.com/embed/irVNGjRFZGk?autoplay=1&mute=1&loop=1&playlist=irVNGjRFZGk&controls=0&showinfo=0&modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Avengers: Doomsday</h1>
    <p>In theaters December 18. Watch the trailer and explore more below.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="play('irVNGjRFZGk','Avengers: Doomsday')">▶ Play Trailer</button>
      <button class="btn btn-secondary" onclick="document.getElementById('trailers').scrollIntoView({behavior:'smooth'})">More Trailers</button>
    </div>
  </div>
</div>

<div class="rows" id="rows"></div>

<div class="player" id="player">
  <header>
    <strong id="ptitle">Now Playing</strong>
    <button onclick="closePlayer()">✕</button>
  </header>
  <div class="screen" id="pscreen"></div>
</div>

<script>
const records = [
  {id:'irVNGjRFZGk', title:'Avengers: Doomsday', type:'Upcoming Trailers'},
  {id:'X1aFkAkFASk', title:'Avengers: Doomsday Special Look', type:'Upcoming Trailers'},
  {id:'Fg0jyss_YnU', title:'Avengers: Doomsday The Return', type:'Upcoming Trailers'},
  {id:'AVjdUMbaEsA', title:'Avengers: Doomsday Official Trailer', type:'Upcoming Trailers'},
  {id:'GPn9wajnOWA', title:'Avengers Doomsday Teaser', type:'Upcoming Trailers'},
  {id:'S-SNLzfrUNw', title:'Ice Age: Boiling Point', type:'Upcoming Trailers'},
  {id:'OT8J-1DO9Fw', title:'Artificial', type:'Upcoming Trailers'},
  {id:'m7b2briPoEk', title:'Remain', type:'Upcoming Trailers'},
  {id:'8q9PUGbIzxw', title:'Children of Blood and Bone', type:'Upcoming Trailers'},
  {id:'mi4gQMDgB_g', title:'Office Romance', type:'Movies'},
  {id:'NTWA_7-ld_U', title:'Moscow Does Not Believe in Tears', type:'Movies'},
  {id:'Q3hBLv-HLEc', title:'Stalker', type:'Movies'},
  {id:'Z8ZhQPaw4rE', title:'Solaris', type:'Movies'},
  {id:'GgFLr2bjUNM', title:'Mimino', type:'Movies'},
  {id:'MkHiu9fD820', title:'The Diamond Arm', type:'Movies'},
  {id:'EYHv8eJrW2Y', title:'Kin-Dza-Dza!', type:'Movies'},
  {id:'tSAKzVP2IGk', title:'Wild Kratts - Stuck on Sharks', type:'Series'},
  {id:'F1z5E5gzlLA', title:'Wild Kratts - Creature Power', type:'Series'},
  {id:'KX2HzjI0XO4', title:'Wild Kratts - Spider Web', type:'Series'},
  {id:'PfgJJ2Sst6A', title:'SUPER WHY! Three Little Pigs', type:'Kids'},
  {id:'DOuRjoRYby8', title:'SUPER WHY! Cinderella', type:'Kids'},
  {id:'QjWhDynv-SQ', title:'Sid the Science Kid', type:'Kids'},
  {id:'wkk_fPp_ZMs', title:'Gulliver\'s Travels', type:'Cartoons'},
  {id:'9kncDIPfWr8', title:'Booba Compilation', type:'Cartoons'},
  {id:'7tuAFeTkBAU', title:'Booba Episodes', type:'Cartoons'}
];

function render(f='') {
  const q = f.toLowerCase();
  const g = {};
  records.forEach(r => {
    if (r.title.toLowerCase().includes(q)) {
      if (!g[r.type]) g[r.type] = [];
      g[r.type].push(r);
    }
  });
  let h = '';
  Object.keys(g).forEach(t => {
    const id = t.toLowerCase().replace(/[^a-z0-9]/g, '');
    h += `<div class="row" id="${id}"><h2>${t}</h2><div class="row-scroll">`;
    g[t].forEach(r => {
      const s = r.title.replace(/'/g, "\\'");
      h += `<div class="card" onclick="play('${r.id}','${s}')"><img src="https://i.ytimg.com/vi/${r.id}/hqdefault.jpg"><div class="card-info"><h3>${r.title}</h3></div></div>`;
    });
    h += '</div></div>';
  });
  document.getElementById('rows').innerHTML = h || '<p style="padding:20px 4%">No results</p>';
}

function play(id, title) {
  document.getElementById('ptitle').textContent = title;
  document.getElementById('pscreen').innerHTML = `
    <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="fallback" id="fb"><p>This video cannot be played here because the owner has disabled embedding.</p><a href="https://www.youtube.com/watch?v=${id}" target="_blank">Watch on YouTube</a></div>`;
  document.getElementById('player').classList.add('show');
  setTimeout(() => { document.getElementById('fb')?.classList.add('show'); }, 1200);
}

function closePlayer() {
  document.getElementById('player').classList.remove('show');
  document.getElementById('pscreen').innerHTML = '';
}

document.getElementById('search').oninput = e => render(e.target.value);
window.addEventListener('scroll', () => document.getElementById('header').classList.toggle('scrolled', window.scrollY > 40));
render();
</script>
</body>
</html>
