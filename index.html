<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>2DayMovie</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, transparent); padding: 18px 4%; display: flex; align-items: center; justify-content: space-between; }
header.scrolled { background: #141414; }
.logo { font-size: 28px; font-weight: 800; color: #e50914; letter-spacing: -1px; }
nav { display: flex; gap: 22px; }
nav a { color: #e5e5e5; font-size: 14px; text-decoration: none; }
nav a:hover { color: #fff; }
.search { background: rgba(0,0,0,.6); border: 1px solid #555; color: #fff; padding: 8px 14px; border-radius: 4px; width: 200px; }
.hero { height: 70vh; min-height: 420px; background: linear-gradient(to right, rgba(20,20,20,.9) 40%, transparent), url('https://i.ytimg.com/vi/mi4gQMDgB_g/maxresdefault.jpg') center/cover; display: flex; align-items: center; padding: 0 4%; }
.hero-content { max-width: 520px; }
.hero h1 { font-size: clamp(36px, 5.5vw, 60px); font-weight: 800; line-height: 1.05; margin-bottom: 14px; }
.hero p { font-size: 16px; color: #ddd; margin-bottom: 22px; line-height: 1.5; }
.btn-row { display: flex; gap: 12px; }
.btn { padding: 12px 26px; border-radius: 4px; font-weight: 600; border: none; cursor: pointer; font-size: 15px; }
.btn-primary { background: #fff; color: #000; }
.btn-secondary { background: rgba(109,109,110,.7); color: #fff; }
.rows { padding: 10px 0 60px; }
.row { margin-bottom: 32px; }
.row h2 { padding: 0 4%; margin-bottom: 10px; font-size: 20px; font-weight: 700; }
.row-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 0 4% 10px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.card { flex: 0 0 230px; position: relative; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform .2s; }
.card:hover { transform: scale(1.08); z-index: 5; }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; display: block; }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.9)); padding: 30px 10px 10px; opacity: 0; transition: opacity .2s; }
.card:hover .card-info { opacity: 1; }
.card-info h3 { font-size: 14px; font-weight: 600; }
.card-info small { font-size: 12px; color: #aaa; }
.player { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 200; display: none; flex-direction: column; }
.player.show { display: flex; }
.player header { background: #111; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; }
.player button { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }
.player .screen { flex: 1; display: grid; place-items: center; padding: 20px; }
.player iframe { width: 100%; max-width: 1200px; aspect-ratio: 16/9; border: 0; border-radius: 8px; }
.fallback { text-align: center; max-width: 440px; display: none; }
.fallback.show { display: block; }
.fallback a { display: inline-block; margin-top: 16px; background: #e50914; color: #fff; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: 600; }
@media (max-width: 700px) { nav { display: none; } .search { width: 140px; } .hero { height: 55vh; } }
</style>
</head>
<body>
<header id="header">
  <div class="logo">2DAYMOVIE</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Movies</a>
    <a href="#">Series</a>
    <a href="#">Kids</a>
  </nav>
  <input class="search" type="search" id="search" placeholder="Search titles...">
</header>

<div class="hero">
  <div class="hero-content">
    <h1>Worldwide Cinema</h1>
    <p>Full-length films, series, cartoons, and more. Click any title to watch.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="document.getElementById('rows').scrollIntoView({behavior:'smooth'})">▶ Play</button>
      <button class="btn btn-secondary">More Info</button>
    </div>
  </div>
</div>

<div class="rows" id="rows"></div>

<div class="player" id="player">
  <header>
    <strong id="ptitle">Now Playing</strong>
    <button onclick="closePlayer()">✕</button>
  </header>
  <div class="screen" id="pscreen"></div>
</div>

<script>
const records = [
  {id:'mi4gQMDgB_g', title:'Office Romance', creator:'Mosfilm', type:'Movies'},
  {id:'NTWA_7-ld_U', title:'Moscow Does Not Believe in Tears', creator:'Mosfilm', type:'Movies'},
  {id:'Q3hBLv-HLEc', title:'Stalker', creator:'Mosfilm', type:'Movies'},
  {id:'Z8ZhQPaw4rE', title:'Solaris', creator:'Mosfilm', type:'Movies'},
  {id:'GgFLr2bjUNM', title:'Mimino', creator:'Mosfilm', type:'Movies'},
  {id:'MkHiu9fD820', title:'The Diamond Arm', creator:'Mosfilm', type:'Movies'},
  {id:'EYHv8eJrW2Y', title:'Kin-Dza-Dza!', creator:'Mosfilm', type:'Movies'},
  {id:'a-RLbCXVvwI', title:'The Red Snowball Tree', creator:'Mosfilm', type:'Movies'},
  {id:'Mhz-bn1ys4Y', title:'Scarlet Sails', creator:'Mosfilm', type:'Movies'},
  {id:'tSAKzVP2IGk', title:'Wild Kratts - Stuck on Sharks', creator:'PBS KIDS', type:'Series'},
  {id:'F1z5E5gzlLA', title:'Wild Kratts - Creature Power', creator:'PBS KIDS', type:'Series'},
  {id:'KX2HzjI0XO4', title:'Wild Kratts - Spider Web', creator:'PBS KIDS', type:'Series'},
  {id:'rRCRY9m1g9Q', title:'Wild Kratts - Panda Power', creator:'PBS KIDS', type:'Series'},
  {id:'5XpyVz5Bb7c', title:'Wild Kratts - Outfoxed', creator:'PBS KIDS', type:'Series'},
  {id:'PfgJJ2Sst6A', title:'SUPER WHY! Three Little Pigs', creator:'PBS KIDS', type:'Kids'},
  {id:'DOuRjoRYby8', title:'SUPER WHY! Cinderella', creator:'PBS KIDS', type:'Kids'},
  {id:'QjWhDynv-SQ', title:'Sid the Science Kid', creator:'PBS KIDS', type:'Kids'},
  {id:'wkk_fPp_ZMs', title:'Gulliver\'s Travels', creator:'Classic', type:'Cartoons'},
  {id:'9kncDIPfWr8', title:'Booba Compilation', creator:'Booba', type:'Cartoons'},
  {id:'7tuAFeTkBAU', title:'Booba Episodes', creator:'Booba', type:'Cartoons'},
  {id:'dQw4w9WgXcQ', title:'Never Gonna Give You Up', creator:'Rick Astley', type:'Music'},
  {id:'9bZkp7q19f0', title:'Gangnam Style', creator:'PSY', type:'Music'},
  {id:'kJQP7kiw5Fk', title:'Despacito', creator:'Luis Fonsi', type:'Music'},
  {id:'jNQXAC9IVRw', title:'Me at the zoo', creator:'jawed', type:'Vlogs'},
  {id:'L_jWHffIx5E', title:'Smells Like Teen Spirit', creator:'Nirvana', type:'Live Shows'},
  {id:'eVTXPUF4Oz4', title:'Linkin Park - In The End', creator:'Linkin Park', type:'Live Shows'},
  {id:'v2AC41dglnM', title:'AC/DC - Thunderstruck', creator:'AC/DC', type:'Live Shows'},
  {id:'60ItHLz5WEA', title:'Alan Walker - Faded', creator:'Alan Walker', type:'Live Shows'},
  {id:'bTqVqk7FSmY', title:'Dune Part Two Trailer', creator:'Warner Bros', type:'Upcoming Trailers'},
  {id:'TcMBFSGVi1c', title:'Avengers Endgame Trailer', creator:'Marvel', type:'Upcoming Trailers'},
  {id:'EXeTwQWrcwY', title:'The Dark Knight Trailer', creator:'Warner Bros', type:'Upcoming Trailers'},
  {id:'8hP9D6kZseM', title:'Inception Trailer', creator:'Warner Bros', type:'Upcoming Trailers'},
  {id:'zSWdZVtXT7E', title:'Interstellar Trailer', creator:'Paramount', type:'Upcoming Trailers'}
];

function render(f='') {
  const q = f.toLowerCase();
  const g = {};
  records.forEach(r => {
    if (r.title.toLowerCase().includes(q)) {
      if (!g[r.type]) g[r.type] = [];
      g[r.type].push(r);
    }
  });
  let h = '';
  Object.keys(g).forEach(t => {
    h += `<div class="row"><h2>${t}</h2><div class="row-scroll">`;
    g[t].forEach(r => {
      const s = r.title.replace(/'/g, "\\'");
      h += `<div class="card" onclick="play('${r.id}','${s}')"><img src="https://i.ytimg.com/vi/${r.id}/hqdefault.jpg"><div class="card-info"><h3>${r.title}</h3><small>${r.creator}</small></div></div>`;
    });
    h += '</div></div>';
  });
  document.getElementById('rows').innerHTML = h || '<p style="padding:20px 4%">No results</p>';
}

function play(id, title) {
  document.getElementById('ptitle').textContent = title;
  document.getElementById('pscreen').innerHTML = `
    <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="fallback" id="fb"><p>This video cannot be played here because the owner has disabled embedding.</p><a href="https://www.youtube.com/watch?v=${id}" target="_blank">Watch on YouTube</a></div>`;
  document.getElementById('player').classList.add('show');
  setTimeout(() => { document.getElementById('fb')?.classList.add('show'); }, 1200);
}

function closePlayer() {
  document.getElementById('player').classList.remove('show');
  document.getElementById('pscreen').innerHTML = '';
}

document.getElementById('search').oninput = e => render(e.target.value);
window.addEventListener('scroll', () => document.getElementById('header').classList.toggle('scrolled', window.scrollY > 40));
render();
</script>
</body>
</html>
