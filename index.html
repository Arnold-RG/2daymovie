<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2DayMovie — Worldwide Cinema</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, transparent); padding: 16px 4%; display: flex; align-items: center; justify-content: space-between; transition: background .3s; }
header.scrolled { background: #141414; }
.logo { font-size: 26px; font-weight: 800; color: #e50914; }
nav { display: flex; gap: 20px; }
nav a { color: #e5e5e5; font-size: 14px; text-decoration: none; }
nav a:hover { color: #fff; }
.search { background: rgba(0,0,0,.5); border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 4px; width: 180px; }
.hero { height: 75vh; min-height: 480px; position: relative; overflow: hidden; }
.hero-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s; }
.hero-slide.active { opacity: 1; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(20,20,20,.85) 35%, transparent 70%); }
.hero-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 4%; max-width: 580px; }
.hero h1 { font-size: clamp(36px, 5vw, 58px); font-weight: 800; line-height: 1.05; margin-bottom: 12px; }
.hero p { font-size: 17px; color: #ddd; margin-bottom: 20px; }
.btn-row { display: flex; gap: 12px; }
.btn { padding: 12px 24px; border-radius: 4px; font-weight: 600; border: none; cursor: pointer; }
.btn-primary { background: #fff; color: #000; }
.btn-secondary { background: rgba(109,109,110,.7); color: #fff; }
.rows { padding: 20px 0 60px; }
.row { margin-bottom: 28px; }
.row h2 { padding: 0 4%; margin-bottom: 10px; font-size: 20px; font-weight: 700; }
.row-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 4% 10px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.card { flex: 0 0 220px; background: #1a1a1a; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform .2s; }
.card:hover { transform: scale(1.06); }
.card img { width: 100%; height: 124px; object-fit: cover; background: #222; display: block; }
.card .info { padding: 8px 10px 12px; }
.card h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.card small { color: #888; font-size: 11px; }
@media (max-width: 700px) { nav { display: none; } .search { width: 120px; } }
</style>
</head>
<body>
<header id="header">
  <div class="logo">2DAYMOVIE</div>
  <nav>
    <a href="#nollywood">Nollywood</a>
    <a href="#rwanda">Rwanda</a>
    <a href="#france">France</a>
    <a href="#international">International</a>
    <a href="#india">India</a>
    <a href="#asia">Asia</a>
    <a href="#kids">Kids</a>
    <a href="#ai">AI & Manhwa</a>
    <a href="#wildlife">Wildlife</a>
  </nav>
  <input class="search" type="search" id="search" placeholder="Search channels...">
</header>

<div class="hero">
  <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1400')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1400')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=1400')"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Worldwide Cinema</h1>
    <p>Nollywood, Rwanda, France, India, Asia, Kids, AI Animation and Wildlife — all from official YouTube channels.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="document.getElementById('nollywood').scrollIntoView({behavior:'smooth'})">▶ Browse</button>
      <button class="btn btn-secondary">More Info</button>
    </div>
  </div>
</div>

<div class="rows" id="rows"></div>

<script>
const channels = [
  {name:'RuthKadiri247', url:'https://www.youtube.com/@RuthKadiri247', cat:'Nollywood'},
  {name:'Omoni Oboli TV', url:'https://www.youtube.com/@OmoniOboliTV', cat:'Nollywood'},
  {name:'Uchenna Mbunabo TV', url:'https://www.youtube.com/@UCHENNAMBUNABOTV02', cat:'Nollywood'},
  {name:'Maurice Sam TV', url:'https://www.youtube.com/@mauricesamtv', cat:'Nollywood'},
  {name:'Bimbo Ademoye TV', url:'https://www.youtube.com/@BimboAdemoyeTV', cat:'Nollywood'},
  {name:'Royal Arts TV', url:'https://www.youtube.com/@RoyalArtsTV', cat:'Nollywood'},
  {name:'Biodun Stephen TV', url:'https://www.youtube.com/@BiodunStephenTV', cat:'Nollywood'},
  {name:'Mercy Johnson Okojie TV', url:'https://www.youtube.com/@MercyJohnsonOkojieTV', cat:'Nollywood'},
  {name:'ZACU ENTERTAINMENT', url:'https://www.youtube.com/channel/UC6V5-_gKvbQ8P86cUM5UkxQ', cat:'Rwanda'},
  {name:'Grace Rwanda Movies', url:'https://www.youtube.com/channel/UC7blKkBISrBIk3tTCR_El6w', cat:'Rwanda'},
  {name:'Vision House Films', url:'https://www.youtube.com/@visionhousefilms', cat:'Rwanda'},
  {name:'myCINÉMA', url:'https://www.youtube.com/@mycinemafr', cat:'France'},
  {name:'Cinéma Cinémas', url:'https://www.youtube.com/@CinemaCinemas', cat:'France'},
  {name:'CINE PRIME', url:'https://www.youtube.com/@cine_prime', cat:'France'},
  {name:'FilmRise Movies', url:'https://www.youtube.com/@FilmRiseMovies', cat:'International'},
  {name:'Mosfilm', url:'https://www.youtube.com/MosfilmRuOfficial', cat:'International'},
  {name:'The Midnight Screening', url:'https://www.youtube.com/@themidnightscreening', cat:'International'},
  {name:'Goldmines', url:'https://www.youtube.com/@goldminestelefilms', cat:'India'},
  {name:'Shemaroo Movies', url:'https://www.youtube.com/@ShemarooMovies', cat:'India'},
  {name:'Rajshri', url:'https://www.youtube.com/@rajshri', cat:'India'},
  {name:'China Movie Channel ENGLISH', url:'https://www.youtube.com/@cctv6-english', cat:'Asia'},
  {name:'iQIYI', url:'https://www.youtube.com/@iQIYIofficial', cat:'Asia'},
  {name:'Korean Classic Film', url:'https://www.youtube.com/KoreanFilm', cat:'Asia'},
  {name:'KBS World TV', url:'https://www.youtube.com/@kbsworldtv', cat:'Asia'},
  {name:'Peppa Pig', url:'https://www.youtube.com/@PeppaPigOfficial', cat:'Kids'},
  {name:'Bluey', url:'https://www.youtube.com/@blueyofficialchannel', cat:'Kids'},
  {name:'Masha and the Bear', url:'https://www.youtube.com/@mashabearen', cat:'Kids'},
  {name:'PBS KIDS', url:'https://www.youtube.com/@PBSKIDS', cat:'Kids'},
  {name:'CoComelon', url:'https://www.youtube.com/@CoComelon', cat:'Kids'},
  {name:'KNK Studio Official', url:'https://www.youtube.com/channel/UCq0dmizYYTl_QcBuHTPOLMQ', cat:'AI & Manhwa'},
  {name:'Manhwa Horizon', url:'https://www.youtube.com/channel/UCFBbqzFEX8NAP5z1qlKA0Vw', cat:'AI & Manhwa'},
  {name:'FILM CRUX', url:'https://www.youtube.com/@FILMCRUX', cat:'AI & Manhwa'},
  {name:'BBC Earth', url:'https://www.youtube.com/@BBCEarth', cat:'Wildlife'},
  {name:'National Geographic', url:'https://www.youtube.com/@NatGeo', cat:'Wildlife'},
  {name:'Nat Geo WILD', url:'https://www.youtube.com/@NatGeoWild', cat:'Wildlife'},
  {name:'WildEarth', url:'https://www.youtube.com/@WildEarth', cat:'Wildlife'}
];

function render(filter='') {
  const q = filter.toLowerCase();
  const groups = {};
  channels.forEach(c => {
    if (c.name.toLowerCase().includes(q)) {
      if (!groups[c.cat]) groups[c.cat] = [];
      groups[c.cat].push(c);
    }
  });
  let html = '';
  Object.keys(groups).forEach(cat => {
    const id = cat.toLowerCase().replace(/[^a-z0-9]/g, '');
    html += `<div class="row" id="${id}"><h2>${cat}</h2><div class="row-scroll">`;
    groups[cat].forEach(c => {
      html += `<div class="card" onclick="window.open('${c.url}','_blank')">
        <img src="https://via.placeholder.com/220x124/222/fff?text=${encodeURIComponent(c.name)}" alt="">
        <div class="info"><h3>${c.name}</h3><small>Official Channel</small></div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('rows').innerHTML = html || '<p style="padding:20px 4%">No channels found.</p>';
}

let slide = 0;
const slides = document.querySelectorAll('.hero-slide');
setInterval(() => {
  slides[slide].classList.remove('active');
  slide = (slide + 1) % slides.length;
  slides[slide].classList.add('active');
}, 5000);

document.getElementById('search').oninput = e => render(e.target.value);
window.addEventListener('scroll', () => document.getElementById('header').classList.toggle('scrolled', window.scrollY > 40));
render();
</script>
</body>
</html>
